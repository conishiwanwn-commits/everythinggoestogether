
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos · Everything Goes Together</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      background: #fffaf8;
      color: #55434a;
      font-family: Georgia, serif;
    }

    header {
      text-align: center;
      padding: 20px;
      background: #f8e8ee;
      border-bottom: 1px solid #ecd5dd;
    }

    h1, h2 {
      color: #a9637b;
      font-weight: normal;
    }

    main {
      max-width: 750px;
      margin: 30px auto;
    }

    .panel {
      background: white;
      border: 1px solid #ecd5dd;
      padding: 25px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #e5cbd4;
      background: #fffafc;
      font-family: inherit;
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      border: 0;
      background: #a9637b;
      color: white;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      background: transparent;
      color: #a9637b;
      border: 1px solid #d99caf;
      margin-bottom: 20px;
    }

    .product-card {
      border-top: 1px solid #ecd5dd;
      padding: 20px 0;
    }

    .product-card img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      display: block;
      margin-bottom: 12px;
    }

    .edit-button {
      background: #a9637b;
    }

    #status {
      color: #a9637b;
      margin-top: 15px;
    }

    #product-list {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Everything Goes Together ♡</h1>
  <p>Administración de pequeños tesoros 🎀</p>
</header>

<main>

  <button class="back" onclick="window.location.href='dashboard.html'">
    ← Volver al panel
  </button>

  <!-- FORMULARIO PARA AGREGAR PRODUCTOS -->

  <section class="panel">
    <h2>♡ Agregar un producto</h2>
    <p>Completa los datos de tu nueva prenda o accesorio.</p>

    <form id="product-form">

      <label>Nombre del producto</label>
      <input type="text" id="nombre" required>

      <label>Descripción</label>
      <textarea id="descripcion" rows="3"></textarea>

      <label>Precio (CLP)</label>
      <input type="number" id="precio" min="0" required>

      <label>Categoría</label>
      <select id="categoria">
        <option value="Ropa">Ropa</option>
        <option value="Accesorios">Accesorios</option>
        <option value="Calzado">Calzado</option>
        <option value="Otros">Otros</option>
      </select>

      <label>Stock disponible</label>
      <input type="number" id="stock" min="0" value="1" required>

      <label>Fotografía del producto</label>
      <input type="file" id="imagen" accept="image/*">

      <button type="submit" id="save-button">
        Guardar producto ♡
      </button>

    </form>

    <p id="status"></p>
  </section>

  <!-- LISTADO DE PRODUCTOS -->

  <section class="panel">
    <h2>♡ Mis productos</h2>
    <p>Aquí puedes revisar y editar tus pequeños tesoros.</p>

    <div id="product-list">
      <p>Cargando productos... ♡</p>
    </div>
  </section>

</main>

<script>

  // CONEXIÓN CON SUPABASE

  const SUPABASE_URL = "https://dmjvqxeztamhvmqkvjph.supabase.co";

  const SUPABASE_KEY = "sb_publishable_0NB-qGXqy51VG1IzKk_H8Q_dbpt8ogM";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // COMPROBAR SESIÓN

  async function checkAccess() {

    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
      window.location.href = "admin.html";
      return false;
    }

    return true;
  }


  // FORMATEAR PRECIO

  function formatPrice(price) {
    return Number(price || 0).toLocaleString("es-CL");
  }


  // MOSTRAR PRODUCTOS

  async function loadAdminProducts() {

    const container = document.getElementById("product-list");

    container.innerHTML = "<p>Cargando productos... ♡</p>";

    const { data, error } = await supabaseClient
      .from("Products")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      container.textContent = "Error al cargar productos: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = "<p>Aún no tienes productos ♡</p>";
      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      const article = document.createElement("article");
      article.className = "product-card";

      if (product.imagen_url) {
        const img = document.createElement("img");
        img.src = product.imagen_url;
        img.alt = product.nombre || "Producto";
        article.appendChild(img);
      }

      const title = document.createElement("h3");
      title.textContent = product.nombre;
      article.appendChild(title);

      const description = document.createElement("p");
      description.textContent = product.descripcion || "";
      article.appendChild(description);

      const price = document.createElement("p");
      price.textContent = "Precio: $" + formatPrice(product.precio);
      article.appendChild(price);

      const stock = document.createElement("p");
      stock.textContent = "Stock: " + (product.stock ?? 0);
      article.appendChild(stock);

      const category = document.createElement("p");
      category.textContent = "Categoría: " + (product.categoria || "Sin categoría");
      article.appendChild(category);

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "edit-button";
      editButton.textContent = "Editar ♡";

      editButton.addEventListener("click", () => {
        editProduct(product);
      });

      article.appendChild(editButton);

// Botón para eliminar
const deleteButton = document.createElement("button");
deleteButton.type = "button";
deleteButton.textContent = "Eliminar ♡";
deleteButton.style.background = "#8b4d5e";
deleteButton.style.color = "white";
deleteButton.style.border = "none";
deleteButton.style.padding = "10px 16px";
deleteButton.style.borderRadius = "20px";
deleteButton.style.cursor = "pointer";

deleteButton.addEventListener("click", async () => {
  const confirmed = confirm(
    `¿Seguro que quieres eliminar "${product.nombre}"? Esta acción no se puede deshacer.`
  );

  if (!confirmed) return;

  const { error } = await supabaseClient
    .from("Products")
    .delete()
    .eq("id", product.id);

  if (error) {
    alert("No se pudo eliminar el producto: " + error.message);
    return;
  }

  alert("¡Producto eliminado correctamente! ♡");
  await loadAdminProducts();
});

article.appendChild(deleteButton);

container.appendChild(article);

    }); // Cierra data.forEach
  } // Cierra loadAdminProducts

  // EDITAR PRODUCTOS

  async function editProduct(product) {

    const nombre = prompt(
      "Nombre del producto:",
      product.nombre
    );

    if (nombre === null) return;

    if (!nombre.trim()) {
      alert("El nombre no puede estar vacío.");
      return;
    }

    const descripcion = prompt(
      "Descripción:",
      product.descripcion || ""
    );

    if (descripcion === null) return;

    const precioTexto = prompt(
      "Precio en CLP:",
      product.precio
    );

    if (precioTexto === null) return;

    const categoria = prompt(
      "Categoría:",
      product.categoria || "Ropa"
    );

    if (categoria === null) return;

    const stockTexto = prompt(
      "Stock disponible:",
      product.stock ?? 0
    );

    if (stockTexto === null) return;

    const precio = Number(precioTexto);
    const stock = Number(stockTexto);

    if (
      !Number.isFinite(precio) ||
      precio < 0 ||
      !Number.isInteger(stock) ||
      stock < 0
    ) {
      alert("Revisa el precio y el stock. ♡");
      return;
    }

    const { error } = await supabaseClient
      .from("Products")
      .update({
        nombre: nombre.trim(),
        descripcion: descripcion,
        precio: precio,
        categoria: categoria,
        stock: stock
      })
      .eq("id", product.id);

    if (error) {
      console.error(error);
      alert("No se pudo actualizar: " + error.message);
      return;
    }

    alert("¡Producto actualizado correctamente! ♡");

    await loadAdminProducts();

  }


  // AGREGAR PRODUCTOS NUEVOS

  document.getElementById("product-form").addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const status = document.getElementById("status");
      const button = document.getElementById("save-button");

      button.disabled = true;

      status.textContent = "Guardando tu pequeño tesoro... ♡";

      try {

        const nombre = document.getElementById("nombre").value.trim();

        const descripcion = document.getElementById("descripcion").value.trim();

        const precio = Number(document.getElementById("precio").value);

        const categoria = document.getElementById("categoria").value;

        const stock = Number(document.getElementById("stock").value);

        const imagen = document.getElementById("imagen").files[0];

        if (
          !nombre ||
          !Number.isFinite(precio) ||
          precio < 0 ||
          !Number.isInteger(stock) ||
          stock < 0
        ) {
          throw new Error("Revisa el nombre, precio y stock.");
        }

        let imagen_url = null;

        // SUBIR FOTOGRAFÍA

        if (imagen) {

          if (!imagen.type.startsWith("image/")) {
            throw new Error("Selecciona un archivo de imagen válido.");
          }

          const extension = imagen.name.split(".").pop().toLowerCase();

          const nombreArchivo = `${crypto.randomUUID()}.${extension}`;

          const { error: uploadError } = await supabaseClient
            .storage
            .from("product-images")
            .upload(nombreArchivo, imagen);

          if (uploadError) {
            throw uploadError;
          }

          const { data: imageData } = supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(nombreArchivo);

          imagen_url = imageData.publicUrl;

        }

        // GUARDAR EN LA TABLA PRODUCTS

        const { error } = await supabaseClient
          .from("Products")
          .insert([{
            nombre,
            descripcion,
            precio,
            categoria,
            stock,
            imagen_url
          }]);

        if (error) {
          throw error;
        }

        status.textContent = "¡Producto guardado correctamente! ♡";

        document.getElementById("product-form").reset();

        await loadAdminProducts();

      } catch (error) {

        console.error(error);

        status.textContent = "No se pudo guardar: " + error.message;

      } finally {

        button.disabled = false;

      }

    }
  );


  // INICIAR PÁGINA

  async function init() {

    const autorizado = await checkAccess();

    if (autorizado) {
      await loadAdminProducts();
    }

  }

  init();
</script>

</body>
</html>
