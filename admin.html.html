
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración · Everything Goes Together</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #fffaf8;
      color: #55434a;
      font-family: Georgia, serif;
    }

    .login {
      width: min(420px, 100%);
      padding: 40px 30px;
      text-align: center;
      background: white;
      border: 1px solid #ecd5dd;
      border-radius: 8px;
      box-shadow: 0 8px 30px #a9637b15;
    }

    h1 {
      color: #a9637b;
      font-size: 30px;
      font-weight: normal;
      font-style: italic;
    }

    p { color: #927985; }

    label {
      display: block;
      margin: 18px 0 7px;
      text-align: left;
      color: #a9637b;
      font: 12px Arial, sans-serif;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ecd5dd;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      background: #a9637b;
      color: white;
      cursor: pointer;
      font: 12px Arial, sans-serif;
      letter-spacing: 1px;
    }

    #message {
      margin-top: 15px;
      font: 13px Arial, sans-serif;
    }

    a {
      display: inline-block;
      margin-top: 22px;
      color: #a9637b;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <main class="login">
    <h1>Everything Goes Together ♡</h1>
    <p>Panel de administración</p>

    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        required
        placeholder="Tu correo"
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        required
        placeholder="Tu contraseña"
      >

      <button type="submit" id="login-button">
        INICIAR SESIÓN ♡
      </button>
    </form>

    <div id="message" role="status"></div>

    <a href="index.html">Volver a la tienda</a>
  </main>

  <script>
    const SUPABASE_URL = "https://dmjvqxeztamhvmqkvjph.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0NB-qGXqy51VG1IzKk_H8Q_dbpt8ogM";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginForm = document.getElementById("login-form");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("login-button");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "INGRESANDO...";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      });

      loginButton.disabled = false;
      loginButton.textContent = "INICIAR SESIÓN ♡";

      if (error) {
        message.style.color = "#b34460";
        message.textContent = "No se pudo iniciar sesión. Revisa tus datos.";
        console.error(error);
        return;
      }

      message.style.color = "#56805e";
      message.textContent = "¡Bienvenida! ♡";

      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
