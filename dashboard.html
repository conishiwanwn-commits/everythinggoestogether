
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda · Everything Goes Together</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fffaf8;
      color: #55434a;
      font-family: Georgia, serif;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #f8e8ee;
      border-bottom: 1px solid #ecd5dd;
    }

    h1 {
      color: #a9637b;
      font-style: italic;
      font-weight: normal;
    }

    main {
      width: min(950px, 92%);
      margin: 40px auto;
    }

    .welcome {
      padding: 30px;
      background: white;
      border: 1px solid #ecd5dd;
      text-align: center;
    }

    h2 { color: #a9637b; font-weight: normal; }

    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .action {
      padding: 28px 18px;
      background: white;
      border: 1px solid #ecd5dd;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      border: 0;
      background: #a9637b;
      color: white;
      cursor: pointer;
    }

    .logout {
      background: transparent;
      color: #a9637b;
      border: 1px solid #d99caf;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      color: #a9637b;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everything Goes Together ♡</h1>
    <p>Mi pequeño espacio de administración</p>
  </header>

  <main>
    <section class="welcome">
      <h2>¡Bienvenida a tu tienda! 🎀</h2>
      <p>Desde aquí podrás administrar tus pequeños tesoros.</p>
      <button class="logout" id="logout-button">Cerrar sesión</button>
    </section>

    <section class="actions">
      <div class="action">
        <h2>♡ Productos</h2>
        <p>Agregar, editar y eliminar productos.</p>
        <button onclick="window.location.href='productos.html'">
  Administrar productos ♡
</button>
      </div>

      <div class="action">
        <h2>♡ Pedidos</h2>
        <p>Consultar las compras recibidas.</p>
        <button onclick="window.location.href='pedidos.html'">
  Administrar pedidos ♡
</button>
      </div>
    </section>

    <p id="status">Comprobando acceso...</p>
  </main>

  <script>
    const SUPABASE_URL = "https://dmjvqxeztamhvmqkvjph.supabase.co";
    const SUPABASE_KEY = "sb_publishable_0NB-qGXqy51VG1IzKk_H8Q_dbpt8ogM";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function checkAccess() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("status").textContent =
        "Sesión iniciada correctamente ♡";
    }

    document.getElementById("logout-button").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "admin.html";
    });

    checkAccess();
  </script>

</body>
</html>
